name: github-pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Publish docs to gh-pages
        run: |
          set -euo pipefail

          publish_source="$(mktemp -d)"
          publish_worktree="$(mktemp -d)"

          node docs/build-pages.js --out "$publish_source"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add "$publish_worktree" origin/gh-pages
          else
            git worktree add --detach "$publish_worktree"
            git -C "$publish_worktree" checkout --orphan gh-pages
          fi

          find "$publish_worktree" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$publish_source"/. "$publish_worktree"/

          git -C "$publish_worktree" add -A

          if git -C "$publish_worktree" diff --cached --quiet; then
            echo "No GitHub Pages changes to publish."
            exit 0
          fi

          git -C "$publish_worktree" commit -m "Publish GitHub Pages"
          git -C "$publish_worktree" push origin HEAD:gh-pages
