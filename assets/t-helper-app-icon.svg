<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">t-helper application icon</title>
  <desc id="desc">Dark rounded application icon with the t-helper Terraform security mark.</desc>
  <defs>
    <radialGradient id="bg" cx=".78" cy=".86" r="1">
      <stop offset="0" stop-color="#064e61"/>
      <stop offset=".45" stop-color="#080f27"/>
      <stop offset="1" stop-color="#13062a"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="88" fill="url(#bg)"/>
  <circle cx="354" cy="356" r="130" fill="#00e5c4" opacity=".08"/>
  <circle cx="178" cy="150" r="140" fill="#7a35ff" opacity=".12"/>
  <g transform="translate(58 70) scale(1.24)" filter="url(#soft)">
    <image href="t-helper-mark.svg" width="320" height="260"/>
  </g>
</svg>
