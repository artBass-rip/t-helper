name: t-helper-dev

services:
  postgres:
    image: postgres:17-alpine
    profiles:
      - storage
    environment:
      POSTGRES_DB: ${THELPER_POSTGRES_DB:-t_helper_test}
      POSTGRES_USER: ${THELPER_POSTGRES_USER:-t_helper}
      POSTGRES_PASSWORD: ${THELPER_POSTGRES_PASSWORD:-local_password}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - t-helper-dev

volumes:
  postgres-data:

networks:
  t-helper-dev:
    name: t-helper-dev
