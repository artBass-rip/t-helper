name: t-helper-dev

services:
  postgres:
    image: postgres:17-alpine
    profiles:
      - storage
      - offline
    environment:
      POSTGRES_DB: ${THELPER_POSTGRES_DB:-t_helper_test}
      POSTGRES_USER: ${THELPER_POSTGRES_USER:-t_helper}
      POSTGRES_PASSWORD: ${THELPER_POSTGRES_PASSWORD:-local_password}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - t-helper-dev

  test-runner:
    image: golang:1.23-bookworm
    profiles:
      - offline
    working_dir: /workspace
    command:
      - go
      - test
      - ./...
    environment:
      THELPER_POSTGRES_DSN: postgres://${THELPER_POSTGRES_USER:-t_helper}:${THELPER_POSTGRES_PASSWORD:-local_password}@postgres:5432/${THELPER_POSTGRES_DB:-t_helper_test}?sslmode=disable
    volumes:
      - .:/workspace:ro
      - ./.artifacts/test/results:/workspace/.artifacts/test/results
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - t-helper-dev

networks:
  t-helper-dev:
    name: t-helper-dev
