name: t-helper-dev

x-os-test-command: &os-test-command
  - sh
  - -lc
  - |
    go version
    test -f go.mod && go test ./... || echo "Go scaffolding is not present yet"

services:
  test-ubuntu:
    image: golang:1.23-bookworm
    profiles:
      - os-matrix
    working_dir: /workspace
    command: *os-test-command
    volumes:
      - .:/workspace:ro
    networks:
      - t-helper-dev

  test-redhat:
    image: registry.access.redhat.com/ubi9/go-toolset:1.23
    profiles:
      - os-matrix
    working_dir: /workspace
    command: *os-test-command
    volumes:
      - .:/workspace:ro
    networks:
      - t-helper-dev

  test-amazonlinux:
    image: amazonlinux:2023
    profiles:
      - os-matrix
    working_dir: /workspace
    command:
      - sh
      - -lc
      - |
        dnf install -y golang
        go version
        test -f go.mod && go test ./... || echo "Go scaffolding is not present yet"
    volumes:
      - .:/workspace:ro
    networks:
      - t-helper-dev

networks:
  t-helper-dev:
    name: t-helper-dev
